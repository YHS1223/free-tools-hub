<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Privacy Checkup - Free Checklist</title><meta name="description" content="A simple privacy checklist for reviewing passwords, permissions, account recovery and data sharing."><link rel="canonical" href="https://yhs1223.github.io/free-tools-hub/privacy-checkup.html"><style>body{font-family:system-ui;max-width:800px;margin:auto;padding:24px;background:#f7f8fb;color:#172033}.card{background:#fff;padding:24px;border-radius:18px}label{display:block;padding:12px;margin:8px 0;background:#f1f3f7;border-radius:10px}button{padding:12px;border:0;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body><div class="card"><a href="./">← Free Tools Hub</a><h1>Digital Privacy Checkup</h1><p>Quickly review everyday account-security habits. This page does not inspect your device.</p><div id="list"></div><button onclick="window.print()">Print checklist</button></div><script>const q=['Important accounts have unique passwords','Two-step verification is enabled where available','Recovery email/phone information is current','Old apps and services no longer have unnecessary access','You know which apps can access your location','You review privacy settings before sharing sensitive information','You keep important files backed up','You know how to report a suspicious message'];document.getElementById('list').innerHTML=q.map(x=>'<label><input type="checkbox"> '+x+'</label>').join('')</script></body></html>
