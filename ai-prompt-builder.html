<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Prompt Builder - Free Prompt Generator</title><meta name="description" content="Build clearer AI prompts for studying, coding, writing, research and creative projects. Free, private, browser-based."><link rel="canonical" href="https://yhs1223.github.io/free-tools-hub/ai-prompt-builder.html"><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:auto;padding:24px;line-height:1.6;background:#f7f8fb;color:#172033}main{background:white;padding:24px;border-radius:18px}label{display:block;font-weight:700;margin-top:14px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #ccd2dd;border-radius:10px;font:inherit}button{cursor:pointer;font-weight:700;background:#172033;color:white}textarea{min-height:120px}.out{white-space:pre-wrap;background:#f1f3f7;padding:16px;border-radius:12px;margin-top:16px}.back{display:inline-block;margin-bottom:16px}</style></head><body><main><a class="back" href="./">← Free Tools Hub</a><h1>AI Prompt Builder</h1><p>Create a structured prompt without sending your text anywhere.</p><label>Goal</label><input id="goal" placeholder="e.g. Explain photosynthesis"><label>Context</label><textarea id="context" placeholder="What should the AI know?"></textarea><label>Output style</label><select id="style"><option>Clear and beginner-friendly</option><option>Step-by-step</option><option>Concise</option><option>Detailed</option><option>Professional</option></select><label>Constraints</label><textarea id="constraints" placeholder="Language, length, things to avoid..."></textarea><button onclick="build()">Build prompt</button><div id="out" class="out">Your prompt will appear here.</div></main><script>function build(){const g=document.getElementById('goal').value.trim()||'Help me with this task';const c=document.getElementById('context').value.trim()||'No extra context provided.';const s=document.getElementById('style').value;const x=document.getElementById('constraints').value.trim()||'No special constraints.';document.getElementById('out').textContent='Task:\n'+g+'\n\nContext:\n'+c+'\n\nInstructions:\n- Explain your reasoning clearly at an appropriate level.\n- Use a '+s.toLowerCase()+' format.\n- State important assumptions instead of inventing facts.\n\nConstraints:\n'+x+'\n\nBefore finalizing, check the answer for accuracy and clarity.'}</script></body></html>
