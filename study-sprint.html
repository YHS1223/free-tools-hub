<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Sprint Timer - Free Focus Timer</title><meta name="description" content="A simple browser-only study sprint timer with custom focus and break lengths."><link rel="canonical" href="https://yhs1223.github.io/free-tools-hub/study-sprint.html"><style>body{font-family:system-ui;max-width:700px;margin:auto;padding:24px;text-align:center;background:#f7f8fb;color:#172033}.card{background:#fff;padding:28px;border-radius:20px}input,button{padding:12px;border:1px solid #ccd2dd;border-radius:10px;font:inherit;margin:6px}button{cursor:pointer;font-weight:700}.time{font-size:64px;font-weight:800;margin:30px 0}</style></head><body><div class="card"><p><a href="./">Free Tools Hub</a></p><h1>Study Sprint Timer</h1><p>Short focused sessions with a built-in break.</p><input id="focus" type="number" min="1" value="25"> min focus <input id="rest" type="number" min="1" value="5"> min break<div class="time" id="time">25:00</div><button onclick="start()">Start</button><button onclick="pause()">Pause</button><button onclick="reset()">Reset</button><p id="mode">Focus</p></div><script>let t=1500,run=false,mode='Focus',id;function render(){document.getElementById('time').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');document.getElementById('mode').textContent=mode}function tick(){if(!run)return;t--;if(t<=0){mode=mode==='Focus'?'Break':'Focus';t=(mode==='Focus'?+document.getElementById('focus').value:+document.getElementById('rest').value)*60;alert(mode+' time!')}render()}function start(){if(!run){run=true;id=setInterval(tick,1000)}}function pause(){run=false;clearInterval(id)}function reset(){pause();mode='Focus';t=+document.getElementById('focus').value*60;render()}render()</script></body></html>
