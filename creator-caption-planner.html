<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator Caption Planner - Free Content Idea Tool</title><meta name="description" content="Plan short-form content hooks, captions and calls to action with a simple free browser tool."><link rel="canonical" href="https://yhs1223.github.io/free-tools-hub/creator-caption-planner.html"><style>body{font-family:system-ui;max-width:850px;margin:auto;padding:24px;background:#f7f8fb;color:#172033}main{background:white;padding:24px;border-radius:18px}input,textarea,select,button{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd2dd;border-radius:10px;font:inherit}button{cursor:pointer;background:#172033;color:white;font-weight:700}.out{white-space:pre-wrap;background:#f1f3f7;padding:16px;border-radius:12px;margin-top:14px}</style></head><body><main><a href="./">← Free Tools Hub</a><h1>Creator Caption Planner</h1><p>Turn one idea into a small, reusable content plan. No account required.</p><label>Topic</label><input id="topic" placeholder="e.g. 3 study mistakes"><label>Audience</label><input id="aud" placeholder="e.g. high-school students"><label>Platform style</label><select id="plat"><option>Short video</option><option>Carousel</option><option>Blog post</option><option>Newsletter</option></select><button onclick="make()">Generate plan</button><div id="out" class="out"></div></main><script>function make(){let t=document.getElementById('topic').value||'your topic',a=document.getElementById('aud').value||'a general audience',p=document.getElementById('plat').value;document.getElementById('out').textContent='HOOK\nA surprising or useful question about '+t+'.\n\nVALUE\nGive '+a+' three concrete takeaways.\n\nSTRUCTURE\n1. Show the problem\n2. Give the key insight\n3. Demonstrate one example\n4. End with one practical action\n\nFORMAT\nAdapt the structure for '+p+'.\n\nCTA\nInvite the audience to save the post or try the idea themselves.'}</script></body></html>
