<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career & Skills Checklist - Free Planning Tool</title><meta name="description" content="A free browser checklist for choosing skills, projects and learning goals for school or career development."><link rel="canonical" href="https://yhs1223.github.io/free-tools-hub/career-checklist.html"><style>body{font-family:system-ui;max-width:800px;margin:auto;padding:24px;background:#f7f8fb;color:#172033}.card{background:#fff;padding:24px;border-radius:18px}li{margin:12px 0}label{display:block;padding:10px;border-radius:10px;background:#f1f3f7}progress{width:100%;height:20px}</style></head><body><div class="card"><a href="./">← Free Tools Hub</a><h1>Career & Skills Checklist</h1><p>Use this as a planning aid, not a test of your future.</p><div id="list"></div><progress id="p" value="0" max="8"></progress><p id="count">0 / 8 complete</p></div><script>const items=['I can name one skill I want to improve','I have one small project I can finish','I know where to find reliable learning material','I can explain why the skill matters to me','I have practiced the skill this month','I have saved an example of my work','I can describe what I learned from a mistake','I have a next step for the coming week'];let box=document.getElementById('list');items.forEach((x,i)=>{let l=document.createElement('label');l.innerHTML='<input type="checkbox" data-i="'+i+'"> '+x;box.appendChild(l)});box.onchange=()=>{let n=[...box.querySelectorAll('input')].filter(x=>x.checked).length;document.getElementById('p').value=n;document.getElementById('count').textContent=n+' / 8 complete'}</script></body></html>
